<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="120" y1="160" x2="280" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="190" stroke="url(#ringGrad)" stroke-width="2" opacity="0.6"/>
  <circle cx="200" cy="200" r="175" stroke="url(#ringGrad)" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
  <text x="200" y="220" text-anchor="middle" font-family="ui-monospace, 'SF Mono', monospace" font-size="120" font-weight="700" fill="url(#textGrad)" filter="url(#glow)">N</text>
  <text x="200" y="270" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#64748b" letter-spacing="4">NOCT</text>
</svg>
